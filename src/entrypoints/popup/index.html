<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header>
    <div class="logo">IT</div>
    <div class="title">
      <h1>Inline Translator</h1>
      <p id="host">…</p>
    </div>
  </header>

  <button id="toggle" class="primary">Translate page</button>

  <div id="fail-row" hidden>
    <span id="fail-msg"></span>
    <button id="retry">Retry</button>
  </div>

  <div class="row">
    <label for="lang">Target language</label>
    <select id="lang">
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="zh-TW">Chinese (Traditional)</option>
      <option value="en">English</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="es">Spanish</option>
      <option value="ru">Russian</option>
      <option value="pt">Portuguese</option>
      <option value="it">Italian</option>
      <option value="ar">Arabic</option>
      <option value="hi">Hindi</option>
      <option value="th">Thai</option>
      <option value="vi">Vietnamese</option>
      <option value="id">Indonesian</option>
    </select>
  </div>

  <div class="row">
    <label for="service">Service</label>
    <select id="service">
      <option value="google">Google</option>
      <option value="edge">Edge</option>
      <option value="openai">OpenAI compatible</option>
    </select>
  </div>

  <section id="openai-panel" hidden>
    <input id="oa-base" type="text" placeholder="Base URL, e.g. https://api.openai.com/v1" spellcheck="false" />
    <input id="oa-key" type="password" placeholder="API Key" spellcheck="false" />
    <input id="oa-model" type="text" placeholder="Model, e.g. gpt-4o-mini" spellcheck="false" />
  </section>

  <div class="row">
    <label for="style">Translation style</label>
    <select id="style"></select>
  </div>
  <div id="style-preview" aria-hidden="true">
    <div class="src">Reading makes a full man.</div>
    <span class="ilt-t ilt-block"><span class="ilt-i">阅读使人充实，交谈使人敏捷。</span></span>
  </div>

  <label class="check"><input type="checkbox" id="auto-site" /> Auto-translate this site</label>
  <label class="check"><input type="checkbox" id="auto-global" /> Auto-translate new sites by default</label>
  <label class="check"><input type="checkbox" id="floating" /> Show floating button</label>

  <details id="rules">
    <summary>Custom site rules</summary>
    <textarea id="rules-text" rows="6" spellcheck="false"
      placeholder='[{"matches":["*://example.com/*"],"ignore":[".ads"],"block":[],"inline":[],"keep":[],"css":""}]'></textarea>
    <div class="rules-actions">
      <button id="rules-save">Save rules</button>
      <span id="rules-msg"></span>
    </div>
  </details>

  <footer>Alt+A · context menu · floating button</footer>
  <script type="module" src="./main.ts"></script>
</body>

</html>
