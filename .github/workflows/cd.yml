name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve build ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid release tag: $tag" >&2
              exit 1
            fi
            if [[ "v$version" != "$tag" ]]; then
              echo "tag $tag does not match package.json version $version" >&2
              exit 1
            fi
            git rev-parse "refs/tags/$tag" >/dev/null
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "tag $tag does not point to a commit on main" >&2
              exit 1
            fi
            ref="refs/tags/$tag"
          else
            tag=""
            ref="$GITHUB_SHA"
            echo "::notice::Manual build; building inline-translator $version artifacts only."
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: E2E (Windows Edge)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome MV3
        run: npm run build

      - name: Install Playwright
        run: python -m pip install --quiet playwright

      - name: Fixture E2E
        run: python tests/test_extension.py --fixtures-only

      - name: Popup E2E
        run: python tests/test_popup.py

  build:
    name: Package extensions
    needs: [meta, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zip Chrome MV3
        run: npm run zip

      - name: Zip Firefox MV3
        run: npm run zip:firefox

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          chrome=$(find .output -maxdepth 1 -name '*-chrome.zip' | head -1)
          firefox=$(find .output -maxdepth 1 -name '*-firefox.zip' | head -1)
          if [[ -z "$chrome" || -z "$firefox" ]]; then
            echo "extension zips not found" >&2
            exit 1
          fi
          cp "$chrome" "dist/inline-translator-v${VERSION}-chrome.zip"
          cp "$firefox" "dist/inline-translator-v${VERSION}-firefox.xpi"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: inline-translator-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [meta, build]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header --offline
          version: v2.14.2
        env:
          OUTPUT: release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: inline-translator-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip dist/*.xpi)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION Release" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$VERSION Release" --notes-file release-notes.md --verify-tag
          fi